<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meterline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Meterline</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="fuels-card">
      <span class="mono-label">Fuels</span>
      <div id="fuel-chips" class="fuel-chips"></div>
    </div>
    <div class="side-foot">
      <div id="meter-lines" class="meter-lines"></div>
      <button id="sync-now" class="sync-btn" type="button">Sync now</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="segmented" id="presets"></div>
      <div class="year-nav">
        <span class="mono-label">Calendar year</span>
        <div class="year-stepper">
          <button id="prev-year" type="button">&lsaquo;</button>
          <span id="year-label"></span>
          <button id="next-year" type="button">&rsaquo;</button>
        </div>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div class="screen" id="screen-usage">
      <div class="charts" id="usage-charts"></div>
      <aside class="rail" id="usage-rail"></aside>
    </div>
    <div class="screen" id="screen-forecast" hidden>
      <div class="charts" id="forecast-charts"></div>
      <aside class="rail" id="forecast-rail"></aside>
    </div>
  </div>
</div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
